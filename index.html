<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Expense Tracker</title>

  <!-- CSS -->
  <link rel="stylesheet" href="expensetrackers.css">

  <!-- Font Awesome (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <!-- jsPDF (optional – PDF use panna) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<div class="top-bar">
  <h2 class="title">Expense Tracker</h2>
  <button id="clear-all-btn" class="btn small-btn">Clear All</button>
</div>

<div class="container">

  <h4>Current Balance</h4>
  <h1 id="balance">₹0.00</h1>

  <div class="form-control">
    <label>Income</label>
    <input type="number" id="current-balance" placeholder="Enter your Income">
    <button type="button" id="set-balance-btn" class="btn">Set Balance</button>
  </div>

  <div class="inc-exp-container">
    <div>
      <h4>Income</h4>
      <p id="money-plus">+₹0.00</p>
    </div>
    <div>
      <h4>Expense</h4>
      <p id="money-minus">-₹0.00</p>
    </div>
  </div>

  <h3>Add New Transaction</h3>
  <form id="form">

    <div class="form-control">
      <label>Category</label>
      <input list="categories" id="category" placeholder="Enter the  Category">
      <datalist id="categories">
        <option value="Food">
        <option value="Travel">
        <option value="Shopping">
        <option value="Rent">
        <option value="Petrol">
        <option value="Books">
        <option value="Exam-Fees">
        <option value="Others">
      </datalist>
    </div>

    <div class="form-control">
      <label>Amount</label>
      <input type="number" id="amount" placeholder="Enter the Amount">
    </div>

    <button class="btn">Submit</button>
  </form>

  <!-- DAILY SUMMARY -->
  <h3>Daily Summary</h3>
  <input type="text" id="daily-search" placeholder="Search by date YYYY-MM-DD">
  <ul id="daily-summary" class="list"></ul>
  <!-- 🔥 NEW LIST (DAILY VIEW ONLY) -->
 <ul id="daily-view-list" class="list"></ul>
  <div class="history-header">
  <h3 id="selected-day-title">All Transactions</h3>
  <button id="clear-history-btn" class="btn small1-btn">Clear History</button>
</div>
<!-- FILTER -->
  <input type="text" id="search" placeholder="Search category...">
  <input type="date" id="date-filter">
<ul id="list" class="list"></ul>

</div>

<script src="trackerscript.js"></script>
</body>
</html>
